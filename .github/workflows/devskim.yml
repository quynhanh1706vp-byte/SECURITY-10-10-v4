name: DevSkim
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}
permissions:
  contents: read
  security-events: write
jobs:
  devskim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run DevSkim
        uses: microsoft/DevSkim-Action@v1
        with:
          directory-to-scan: .
          output-filename: devskim.sarif
          enable-suppressions-file: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devskim.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: devskim-sarif-${{ github.sha }}
          path: devskim.sarif
