name: DevSkim
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  devskim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/DevSkim-Action@v1
        with:
          directory-to-scan: .
          output-filename: devskim.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devskim.sarif
