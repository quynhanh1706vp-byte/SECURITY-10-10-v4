name: Checkmarx One

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cxone:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkmarx One
        uses: checkmarx/ast-github-action@v2
        with:
          base_url: ${{ secrets.CX_BASE_URL }}          # ví dụ: https://ast.checkmarx.net (US) hoặc URL region của bạn
          cx_tenant: ${{ secrets.CX_TENANT }}           # tên tenant
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}     # OAuth Client ID
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }} # OAuth Client Secret
          project_name: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          additional_params: >
            --scan-types sast,sca,iac-security
            --sast-incremental
            --report-format sarif
            --output-path cx-reports

      - name: Upload SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cx-reports/*.sarif
