name: Trivy (API only)

on:
  push:
    branches: [ main ]
    paths:
      - 'API/**'
      - '.github/workflows/trivy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'API/**'
      - '.github/workflows/trivy.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS scan on API/
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: API
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          skip-dirs: |
            API/**/bin
            API/**/obj
          format: sarif
          output: trivy.sarif
          exit-code: '0'     # không fail job, chỉ báo findings

      - name: Upload SARIF (Trivy)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
