name: autoscan
on: { push: {}, pull_request: {}, workflow_dispatch: {} }

jobs:
  autoscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no LFS download)
        uses: actions/checkout@v4
        with: { lfs: false, fetch-depth: 0 }

      - name: Prepare workspace
        env: { RUN_ID: ${{ github.run_id }} }
        run: |
          set -euxo pipefail
          git lfs install --local --skip-smudge || true
          mkdir -p "_reports/autoscan-${RUN_ID}"
          chmod +x ./run_delivery.sh 2>/dev/null || true
          chmod +x scripts/*.sh 2>/dev/null || true

      - name: Run AutoScan (best-effort)
        env:
          MODE: online
          RUN_ID: ${{ github.run_id }}
          REPORT_DIR: _reports/autoscan-${{ github.run_id }}
        run: |
          set +e
          if [ -x ./run_delivery.sh ]; then
            REPORT_DIR="${REPORT_DIR}" bash ./run_delivery.sh || true
          elif [ -f scripts/scan_all.sh ]; then
            REPORT_DIR="${REPORT_DIR}" bash scripts/scan_all.sh || true
          else
            echo "No autoscan entrypoint found; skipping" >"${REPORT_DIR}/NO_SCAN.txt"
          fi
          if ! find "${REPORT_DIR}" -type f -mindepth 1 -print -quit >/dev/null 2>&1; then
            echo "No reports generated by autoscan at $(date -u)" > "${REPORT_DIR}/NO_REPORTS.txt"
          fi
          echo "### Autoscan outputs" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find "_reports" -maxdepth 3 -type f -printf "%P\n" | sort || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload autoscan reports
        uses: actions/upload-artifact@v4
        with:
          name: autoscan-reports-${{ github.run_id }}
          path: _reports
          if-no-files-found: warn
