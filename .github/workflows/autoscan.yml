name: autoscan
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  autoscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Prepare
        run: |
          set -euxo pipefail
          chmod +x ./run_delivery.sh 2>/dev/null || true
          chmod +x scripts/*.sh 2>/dev/null || true
          mkdir -p _reports

      - name: Run AutoScan (best-effort)
        env:
          MODE: online
        run: |
          set +e
          if [ -x ./run_delivery.sh ]; then
            bash ./run_delivery.sh || true
          elif [ -f scripts/scan_all.sh ]; then
            bash scripts/scan_all.sh || true
          else
            echo "No autoscan entrypoint found; skipping"
          fi

      - name: Upload _reports
        uses: actions/upload-artifact@v4
        with:
          name: autoscan-reports
          path: _reports
          if-no-files-found: ignore
