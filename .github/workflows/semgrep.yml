name: Semgrep (API only)

on:
  push:
    branches: [ main ]
    paths:
      - 'API/**'
      - '.semgrep.yml'
      - '.github/workflows/semgrep.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'API/**'
      - '.semgrep.yml'
      - '.github/workflows/semgrep.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (only API/)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten
          include: |
            API
          exclude: |
            API/**/bin
            API/**/obj
          generateSarif: true
          sarif: semgrep.sarif

      - name: Upload SARIF (Semgrep)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
