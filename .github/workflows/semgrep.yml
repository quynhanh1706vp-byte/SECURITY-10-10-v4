name: Semgrep

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep (JSON+SARIF)
        uses: returntocorp/semgrep-action@v1
        with:
          config: semgrep.master.yml
          generateSarif: "1"
          sarifReportPath: _reports/semgrep_v5/semgrep.sarif
          auditOn: never
        env:
          SEMGREP_TIMEOUT: "900"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: _reports/semgrep_v5/semgrep.sarif
