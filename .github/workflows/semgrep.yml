name: Semgrep
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          generateSarif: "1"
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/csharp
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
