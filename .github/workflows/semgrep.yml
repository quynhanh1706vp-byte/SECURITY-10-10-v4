name: Semgrep (API only)

on:
  push:
    branches: [ main ]
    paths:
      - 'API/**'
      - '.github/workflows/semgrep.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'API/**'
      - '.github/workflows/semgrep.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (API only) -> SARIF
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/r2c-best-practices
          include: API           # CHỈ quét thư mục API
          generateSarif: "1"
          sarifFile: semgrep.sarif

      - name: Upload SARIF (Semgrep)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
