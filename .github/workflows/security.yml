name: security
on: { push: {}, pull_request: {}, workflow_dispatch: {} }

jobs:
  security-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no LFS download)
        uses: actions/checkout@v4
        with: { lfs: false, fetch-depth: 0 }

      - name: Install tools (best-effort)
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          curl -sSfL https://raw.githubusercontent.com/returntocorp/semgrep/main/scripts/install-semgrep.sh | sh -s -- -b /usr/local/bin || true
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | bash -s -- -b /usr/local/bin || true
          curl -sfL  https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin || true
          curl -sSL https://github.com/Checkmarx/kics/releases/latest/download/kics_Linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin kics || true
          git lfs install --local --skip-smudge || true
          mkdir -p _reports/security

      - name: Semgrep (best-effort)
        run: |
          if command -v semgrep >/dev/null; then
            semgrep ci --oss-only --config .semgrep.yml 2>/dev/null || \
            semgrep ci --oss-only --config rules/semgrep 2>/dev/null || \
            semgrep ci --oss-only --config p/owasp-top-ten || true
          else echo "skip semgrep"; fi

      - name: Trivy FS (best-effort)
        run: |
          if command -v trivy >/dev/null; then
            trivy fs --no-progress --exit-code 0 --ignore-unfixed \
              --skip-dirs .git --skip-dirs .git/lfs \
              --skip-files "**/*.tar.gz","**/*.zip","**/*.7z" .
          else echo "skip trivy"; fi

      - name: Gitleaks (best-effort)
        run: |
          if command -v gitleaks >/dev/null; then
            gitleaks detect --no-git --redact --exit-code 0 || true
          else echo "skip gitleaks"; fi

      - name: KICS (best-effort)
        run: |
          if command -v kics >/dev/null; then
            kics scan -p . \
              -e "_reports,dist,node_modules,**/*.tar.gz,**/*.zip,**/*.7z" \
              -o _reports/security/kics --report-formats html,sarif,json --no-progress || true
          else echo "skip kics"; fi

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}
          path: |
            _reports/security/**/*.html
            _reports/security/**/*.json
            _reports/security/**/*.sarif
          if-no-files-found: ignore
