name: security
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  security-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Best-effort install scanners
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          # Semgrep
          curl -sSfL https://raw.githubusercontent.com/returntocorp/semgrep/main/scripts/install-semgrep.sh \
            | sh -s -- -b /usr/local/bin || true
          # Gitleaks
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh \
            | bash -s -- -b /usr/local/bin || true
          # Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin || true
          # KICS
          curl -sSL https://github.com/Checkmarx/kics/releases/latest/download/kics_Linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kics || true
          mkdir -p _reports

      - name: Semgrep (best-effort)
        run: |
          if command -v semgrep >/dev/null; then
            semgrep --version
            if [ -f .semgrep.yml ]; then
              semgrep ci --oss-only --config .semgrep.yml || true
            elif [ -d rules/semgrep ]; then
              semgrep ci --oss-only --config rules/semgrep || true
            else
              semgrep ci --oss-only --config p/owasp-top-ten || true
            fi
          else
            echo "Semgrep not installed; skipping"
          fi

      - name: Trivy FS (best-effort)
        run: |
          if command -v trivy >/dev/null; then
            trivy fs --no-progress --exit-code 0 --ignore-unfixed .
          else
            echo "Trivy not installed; skipping"
          fi

      - name: Gitleaks (best-effort)
        run: |
          if command -v gitleaks >/dev/null; then
            gitleaks detect --no-git --redact --exit-code 0 || true
          else
            echo "Gitleaks not installed; skipping"
          fi

      - name: KICS (best-effort)
        run: |
          if command -v kics >/dev/null; then
            kics scan -p . -o _reports/kics --report-formats html,sarif,json --no-progress || true
          else
            echo "KICS not installed; skipping"
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            _reports/**/*.html
            _reports/**/*.json
            _reports/**/*.sarif
          if-no-files-found: ignore
