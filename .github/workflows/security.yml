name: Security CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"   # Thứ 2 02:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  codeql:
    name: CodeQL (C# + optional JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp,javascript
      - name: Restore
        run: |
          if [ -f "DeMasterProCloud.sln" ]; then
            dotnet restore DeMasterProCloud.sln
          else
            CS=$(git ls-files '*.csproj' | head -n 1)
            [ -n "$CS" ] && dotnet restore "$CS" || true
          fi
      - name: Build (Release, no test)
        run: |
          if [ -f "DeMasterProCloud.sln" ]; then
            dotnet build DeMasterProCloud.sln -c Release --no-restore
          else
            CS=$(git ls-files '*.csproj' | head -n 1)
            [ -n "$CS" ] && dotnet build "$CS" -c Release --no-restore || true
          fi
      - uses: github/codeql-action/analyze@v3
        with:
          category: "codeql"

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/ci
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload SARIF (Semgrep)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  trivy-fs:
    name: Trivy (deps/CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          vuln-type: "os,library"
      - name: Upload SARIF (Trivy FS)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  trivy-secrets:
    name: Trivy (secrets scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy-secrets.sarif
          security-checks: "secret"
      - name: Upload SARIF (Trivy secrets)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-secrets.sarif

  terrascan:
    name: Terrascan (IaC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: tenable/terrascan-action@main
        with:
          iac_type: terraform     # đổi sang k8s/helm nếu bạn dùng cái đó
          iac_version: v14
          policy_type: all
          only_warn: true
          sarif_upload: true
        continue-on-error: true

  sbom-cyclonedx:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (CycloneDX via Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json

  checkmarx:
    name: Checkmarx One
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Checkmarx One (yêu cầu secrets CxBaseURI / CxAPIKey / CxTeam)
      - name: Checkmarx Scan
        uses: checkmarx/ast-github-action@v2
        with:
          base_uri: ${{ secrets.CX_BASE_URI }}          # ví dụ: https://ast.checkmarx.net
          cx_tenant: ${{ secrets.CX_TENANT }}           # tenant ID/name
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}     # nếu dùng OAuth
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          api_key: ${{ secrets.CX_API_KEY }}            # hoặc dùng API key (ưu tiên)
          project_name: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          additional_params: >
            --report-format sarif
            --output-path checkmarx.sarif
      - name: Upload SARIF (Checkmarx)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkmarx.sarif
        # tránh fail toàn CI nếu Checkmarx lỗi quota/credential:
        continue-on-error: true
