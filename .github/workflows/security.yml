name: Security CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"   # chạy mỗi Thứ 2 02:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/ci
          generateSarif: "1"
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN || '' }}
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN || '' }}
      - name: Upload SARIF (Semgrep)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

  codeql:
    name: CodeQL (code scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp,javascript
      - uses: github/codeql-action/analyze@v3

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git --report-format sarif --report-path gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
        if: always()

  trivy:
    name: Trivy (deps & FS scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: trivy-fs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
        if: always()

  terrascan:
    name: Terrascan (IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tenable/terrascan-action@main
        with:
          iac_type: terraform     # đổi thành k8s/helm nếu bạn dùng cái đó
          sarif_upload: true
        continue-on-error: true   # tránh fail CI nếu có nhiều cảnh báo
