name: Security CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  codeql:
    name: CodeQL (C# + optional JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp,javascript
      - name: Restore
        run: |
          if [ -f "DeMasterProCloud.sln" ]; then
            dotnet restore DeMasterProCloud.sln
          else
            CS=$(git ls-files '*.csproj' | head -n 1)
            [ -n "$CS" ] && dotnet restore "$CS" || true
          fi
      - name: Build (Release, no test)
        run: |
          if [ -f "DeMasterProCloud.sln" ]; then
            dotnet build DeMasterProCloud.sln -c Release --no-restore
          else
            CS=$(git ls-files '*.csproj' | head -n 1)
            [ -n "$CS" ] && dotnet build "$CS" -c Release --no-restore || true
          fi
      - uses: github/codeql-action/analyze@v3
        with:
          category: "codeql"

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/ci
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload SARIF (Semgrep)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  trivy-fs:
    name: Trivy (deps/CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          vuln-type: "os,library"
      - name: Upload SARIF (Trivy FS)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  trivy-secrets:
    name: Trivy (secrets scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy-secrets.sarif
          security-checks: "secret"
      - name: Upload SARIF (Trivy secrets)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-secrets.sarif

  terrascan:
    name: Terrascan (IaC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Terrascan (pinned)
        run: |
          set -e
          VERSION="1.18.1"
          curl -sSL "https://github.com/tenable/terrascan/releases/download/v${VERSION}/terrascan_${VERSION}_Linux_x86_64.tar.gz" -o /tmp/ts.tgz
          tar -xzf /tmp/ts.tgz -C /tmp
          sudo mv /tmp/terrascan /usr/local/bin/terrascan
          terrascan version
      - name: Terrascan init
        run: terrascan init
      - name: Terrascan scan (Terraform)
        run: |
          terrascan scan -t terraform -i terraform -o sarif > terrascan.sarif || true
      - name: Upload SARIF (Terrascan)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: terrascan.sarif

  sbom-cyclonedx:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (CycloneDX via Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json

  checkmarx:
    name: Checkmarx One
    # chỉ chạy khi bạn CHỦ ĐỘNG bật secret CX_ENABLED='true' và có đủ secrets Checkmarx
    if: ${{ secrets.CX_ENABLED == 'true' && (secrets.CX_API_KEY != '' || (secrets.CX_CLIENT_ID != '' && secrets.CX_CLIENT_SECRET != '')) && secrets.CX_BASE_URI != '' && secrets.CX_TENANT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkmarx Scan
        uses: checkmarx/ast-github-action@v2
        with:
          base_uri: ${{ secrets.CX_BASE_URI }}
          cx_tenant: ${{ secrets.CX_TENANT }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          api_key: ${{ secrets.CX_API_KEY }}
          project_name: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          additional_params: >
            --report-format sarif
            --output-path checkmarx.sarif
      - name: Upload SARIF (Checkmarx)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkmarx.sarif
