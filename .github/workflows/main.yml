name: security-ci

on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
  workflow_dispatch:
  schedule:
    - cron: "25 2 * * 2"

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: false

# Job 0: phát hiện repo có gì để quyết định chạy các job khác
jobs:
  detect:
    name: Detect project files
    runs-on: ubuntu-latest
    outputs:
      has_any:     ${{ steps.out.outputs.has_any }}
      has_csharp:  ${{ steps.out.outputs.has_csharp }}
      has_js_ts:   ${{ steps.out.outputs.has_js_ts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: out
        name: Scan file types
        run: |
          shopt -s globstar nullglob

          cs_count=$(ls **/*.cs **/*.csproj **/*.sln 2>/dev/null | wc -l || echo 0)
          jsts_count=$(ls **/*.js **/*.ts **/*.tsx 2>/dev/null | wc -l || echo 0)
          any_count=$(ls **/*.* 2>/dev/null | wc -l || echo 0)

          echo "cs_count=$cs_count"
          echo "jsts_count=$jsts_count"
          echo "any_count=$any_count"

          has_csharp=$([ "$cs_count" -gt 0 ] && echo true || echo false)
          has_js_ts=$([ "$jsts_count" -gt 0 ] && echo true || echo false)
          has_any=$([ "$any_count" -gt 0 ] && echo true || echo false)

          {
            echo "has_csharp=$has_csharp"
            echo "has_js_ts=$has_js_ts"
            echo "has_any=$has_any"
          } >> "$GITHUB_OUTPUT"

  # ---------- CodeQL C# ----------
  codeql_csharp:
    name: CodeQL (C#)
    needs: detect
    if: needs.detect.outputs.has_csharp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: autobuild

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Manual build fallback
        run: |
          if ls *.sln 1>/dev/null 2>&1; then
            dotnet restore
            dotnet build -c Release --no-restore
          else
            echo "No .sln found — skip manual build."
          fi

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  # ---------- CodeQL JS/TS ----------
  codeql_js_ts:
    name: CodeQL (JS/TS)
    needs: detect
    if: needs.detect.outputs.has_js_ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: autobuild

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ---------- Semgrep ----------
  semgrep:
    name: Semgrep
    needs: detect
    if: needs.detect.outputs.has_any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Unpack archives (optional)
        run: |
          find . -type f -name '*.tar.gz' -print0 | while IFS= read -r -d '' f; do
            d="${f%.tar.gz}"; mkdir -p "$d"; tar -xzf "$f" -C "$d";
          done

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: |
            p/ci
            p/security-audit
            p/owasp-top-ten
            p/csharp
            p/javascript
            p/typescript
            p/react
            p/docker
            p/kubernetes
            p/terraform
            p/secrets
          generateSarif: true
          sarif: semgrep.sarif
          exit-code: 0   # không fail job khi có finding

      - name: Upload SARIF (Semgrep)
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: semgrep.sarif }

  # ---------- Trivy ----------
  trivy:
    name: Trivy FS scan
    needs: detect
    if: needs.detect.outputs.has_any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Trivy scan → SARIF
        uses: aquasecurity/trivy-action@0.26.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln,secret,config
          exit-code: '0'     # không fail job khi có finding

      - name: Upload SARIF (Trivy)
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy.sarif }

  # ---------- DevSkim ----------
  devskim:
    name: DevSkim
    needs: detect
    if: needs.detect.outputs.has_any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Run DevSkim
        uses: microsoft/DevSkim-Action@v1
        with:
          directory-to-scan: .
          output-filename: devskim-results.sarif
          should-scan-archives: true

      - name: Upload SARIF (DevSkim)
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: devskim-results.sarif }
