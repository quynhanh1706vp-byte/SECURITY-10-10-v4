name: CodeQL (C# API only)

on:
  push:
    paths:
      - 'API/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    paths:
      - 'API/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  codeql:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOLUTION: DeMasterProCloud.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK (6/7/8)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x

      - name: Setup NuGet (classic restore)
        uses: NuGet/setup-nuget@v2

    - if: matrix.language == 'csharp'
      uses: github/codeql-action/autobuild@v3

      - name: NuGet restore (classic)
        shell: pwsh
        run: nuget restore "$env:SOLUTION"
        continue-on-error: true

      - name: dotnet restore (SDK-style)
        shell: pwsh
        run: dotnet restore "$env:SOLUTION" --nologo
        continue-on-error: true

      - name: Build with MSBuild (classic projects)
        shell: pwsh
        run: msbuild "$env:SOLUTION" /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /m /nologo
        continue-on-error: true

      - name: Build with dotnet (SDK-style projects)
        shell: pwsh
        run: dotnet build "$env:SOLUTION" -c Release --no-restore --nologo
        continue-on-error: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended,security-and-quality

      - name: Autobuild (fallback)
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "csharp:api"
