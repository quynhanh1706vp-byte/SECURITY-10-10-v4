name: pmd
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  pmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chạy PMD và xuất SARIF.
      # Lưu ý: PMD chủ yếu hỗ trợ Java/Apex/XML. Nếu repo không có các file này, job sẽ chạy OK nhưng không ra findings.
      - name: Run PMD
        uses: pmd/pmd-github-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          analyze_changed_files: false
          format: sarif
          output: pmd.sarif
          # Tuỳ rulesets theo codebase (Java/XML). Có thể thêm/bớt:
          rulesets: |
            category/java/bestpractices.xml,
            category/java/errorprone.xml,
            category/java/security.xml,
            category/java/performance.xml,
            category/xml/security.xml

      # Upload kết quả PMD lên Code Scanning
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pmd.sarif
