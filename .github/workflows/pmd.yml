name: pmd
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  pmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chạy PMD và xuất SARIF
      - name: Run PMD
        uses: pmd/pmd-github-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          analyze_changed_files: false
          format: sarif
          output: pmd.sarif
          # Chọn rulesets phù hợp project Java/C#
          rulesets: 'category/java/bestpractices.xml,category/java/errorprone.xml'

      # Upload kết quả lên Code Scanning
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pmd.sarif
