name: VSP Security CI/CD

on:
  push:
    branches:
      - main
      - feat/v7-import
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  vsp-security-ci:
    name: VSP Security CI (Khach)
    runs-on: self-hosted

    env:
      VSP_BUNDLE_ROOT: /home/test/Data/SECURITY_BUNDLE
      VSP_SRC_ROOT: /home/test/Data/Khach
      VSP_MAX_CRITICAL: 0
      VSP_MAX_HIGH: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Chuẩn bị script CI OUTER
        run: |
          cd "${{ github.workspace }}"
          chmod +x ci/VSP_CI_OUTER/*.sh
          echo "[CI] Workspace = ${{ github.workspace }}"
          ls ci/VSP_CI_OUTER

      - name: Chạy VSP CI outer cho /home/test/Data/Khach
        run: |
          cd "${{ github.workspace }}"
          ci/VSP_CI_OUTER/vsp_ci_outer_full_v1.sh "${VSP_SRC_ROOT}"

      - name: Upload artifact kết quả VSP CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsp-ci-out-${{ github.run_id }}
          path: |
            out_ci/**
          if-no-files-found: ignore

      - name: Sync CI run mới sang VSP UI (optional)
        if: always()
        run: |
          cd "${{ github.workspace }}"
          if [ -x ci/VSP_CI_OUTER/vsp_ci_sync_last_run_to_vsp_v1.sh ]; then
            ci/VSP_CI_OUTER/vsp_ci_sync_last_run_to_vsp_v1.sh
          else
            echo "[CI] Skip sync: vsp_ci_sync_last_run_to_vsp_v1.sh chưa có hoặc chưa chmod +x."
          fi
