name: VSP Security CI/CD

on:
  push:
    branches:
      - main
      - feat/v7-import
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  vsp-security-ci:
    name: VSP Security CI (FULL EXT)
    runs-on: self-hosted

    env:
      VSP_MODE: CI_CD
      VSP_SRC_ROOT: ${{ github.workspace }}/dmpw_linux_install_v7/code/webapp
      VSP_OUT_DIR: ${{ github.workspace }}/out_ci
      VSP_BUNDLE_ROOT: /home/test/Data/SECURITY_BUNDLE
      # Ngưỡng gate:
      VSP_MAX_CRITICAL: 0
      VSP_MAX_HIGH: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Chuẩn bị script CI outer
        run: |
          chmod +x ci/VSP_CI_OUTER/*.sh
          mkdir -p "${VSP_OUT_DIR}"
          echo "[VSP_CI] SRC_ROOT = ${VSP_SRC_ROOT}"
          echo "[VSP_CI] OUT_DIR = ${VSP_OUT_DIR}"

      - name: Chạy VSP CI outer full
        run: |
          ci/VSP_CI_OUTER/vsp_ci_outer_full_v1.sh

      - name: Upload artifact kết quả VSP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsp-ci-out-${{ github.run_id }}
          path: |
            ${VSP_OUT_DIR}/**
          if-no-files-found: ignore
