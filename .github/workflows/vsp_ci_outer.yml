name: VSP Security CI/CD

on:
  push:
    branches:
      - main
      - feat/v7-import
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  vsp-security-ci:
    name: VSP Security CI (FULL EXT)
    runs-on: self-hosted

    env:
      # Engine VSP bên ngoài (SECURITY_BUNDLE) trên con runner này
      VSP_BUNDLE_ROOT: /home/test/Data/SECURITY_BUNDLE
      # Ngưỡng gate
      VSP_MAX_CRITICAL: 0
      VSP_MAX_HIGH: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Chuẩn bị script VSP CI OUTER
        run: |
          cd "${{ github.workspace }}"
          chmod +x ci/VSP_CI_OUTER/*.sh
          echo "[CI] Workspace = ${{ github.workspace }}"
          ls ci/VSP_CI_OUTER

      - name: Chạy VSP CI outer cho webapp v7
        run: |
          cd "${{ github.workspace }}"
          ci/VSP_CI_OUTER/vsp_ci_outer_full_v1.sh dmpw_linux_install_v7/code/webapp

      - name: Upload artifact kết quả VSP CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsp-ci-out-${{ github.run_id }}
          path: |
            out_ci/**
          if-no-files-found: ignore

      # OPTIONAL: đồng bộ CI run mới nhất sang VSP UI
      - name: Sync last CI run to VSP UI (optional)
        if: always()
        run: |
          cd "${{ github.workspace }}"
          chmod +x ci/VSP_CI_OUTER/vsp_ci_sync_last_run_to_vsp_v1.sh || true
          if [ -x ci/VSP_CI_OUTER/vsp_ci_sync_last_run_to_vsp_v1.sh ]; then
            ci/VSP_CI_OUTER/vsp_ci_sync_last_run_to_vsp_v1.sh
          else
            echo "[CI] Skip sync: vsp_ci_sync_last_run_to_vsp_v1.sh chưa có hoặc chưa chmod +x."
          fi
