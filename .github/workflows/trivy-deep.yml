name: Trivy FS (deep)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  trivy-fs-deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS deep
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,config
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy_fs.sarif
          timeout: 10m
        env:
          TRIVY_SKIP_DIRS: "**/node_modules/**,**/bin/**,**/obj/**,**/dist/**"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
      - name: Save SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarif-trivy-fs-${{ github.sha }}
          path: trivy_fs.sarif
          if-no-files-found: error
        with:
          sarif_file: trivy_fs.sarif
