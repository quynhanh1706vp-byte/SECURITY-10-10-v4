name: Gitleaks (secrets)
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cài Gitleaks CLI (phiên bản ổn định)
      - name: Install Gitleaks
        shell: bash
        run: |
          set -e
          GL_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Chạy quét + sinh SARIF
      - name: Run Gitleaks (SARIF)
        shell: bash
        run: |
          mkdir -p _reports/gitleaks
          # --redact để che giá trị secrets trong log
          gitleaks detect \
            --source . \
            --redact \
            --report-format sarif \
            --report-path _reports/gitleaks/gitleaks.sarif

      # Upload SARIF vào Code Scanning
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: _reports/gitleaks/gitleaks.sarif

      # Lưu artifact (để bạn tải về qua gh run download)
      - name: Save SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks_sarif
          path: _reports/gitleaks/gitleaks.sarif
