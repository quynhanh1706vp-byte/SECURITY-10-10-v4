name: Semgrep
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ ci/add-semgrep-trivy ]   # đổi thành ['**'] nếu muốn chạy mọi nhánh
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Semgrep (via pip)
        run: |
          python3 -m pip install --upgrade pip
          pip install --upgrade semgrep

      - name: Run Semgrep (JSON + SARIF)
        run: |
          mkdir -p _reports/semgrep_v5
          semgrep scan \
            --config semgrep.master.yml \
            --include "dmpw_linux_install_v5/**" \
            --metrics=off --timeout 900 \
            --json --output _reports/semgrep_v5/semgrep.json \
            --sarif --output _reports/semgrep_v5/semgrep.sarif

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: _reports/semgrep_v5/semgrep.sarif

      - name: Upload semgrep.json as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep_json
          path: _reports/semgrep_v5/semgrep.json

      - name: Upload semgrep.sarif as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep_sarif
          path: _reports/semgrep_v5/semgrep.sarif
