name: Security CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"   # Thứ 2 02:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  codeql:
    name: CodeQL (C# + optional JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: bật cache NuGet cho .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: csharp,javascript
          # Nếu repo chỉ C#, bạn có thể đổi thành: csharp

      - name: Restore
        run: |
          # ưu tiên solution nếu có
          if [ -f "DeMasterProCloud.sln" ]; then
            dotnet restore DeMasterProCloud.sln
          else
            # fallback: tìm csproj lớn nhất
            CS=$(git ls-files '*.csproj' | head -n 1)
            [ -n "$CS" ] && dotnet restore "$CS" || true
          fi

      - name: Build (Release, no test)
        run: |
          if [ -f "DeMasterProCloud.sln" ]; then
            dotnet build DeMasterProCloud.sln -c Release --no-restore
          else
            CS=$(git ls-files '*.csproj' | head -n 1)
            [ -n "$CS" ] && dotnet build "$CS" -c Release --no-restore || true
          fi

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "codeql"

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semgrep CI
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF (Semgrep)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  gitleaks:
    name: Gitleaks (Secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git --report-format sarif --report-path gitleaks.sarif
      - name: Upload SARIF (Gitleaks)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

  trivy-fs:
    name: Trivy (FileSystem deps/CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          vuln-type: "os,library"
      - name: Upload SARIF (Trivy FS)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  terrascan:
    name: Terrascan (IaC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Terrascan scan
        uses: tenable/terrascan-action@main
        with:
          iac_type: terraform            # đổi sang k8s/helm nếu bạn dùng cái đó
          iac_version: v14               # hoặc v12/v13 tùy code
          policy_type: all
          only_warn: true                # tránh fail job vì vi phạm policy
          sarif_upload: true
        continue-on-error: true          # luôn tiếp tục để không chặn tổng thể
